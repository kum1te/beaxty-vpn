name: Build & Release Portable

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  resolve-build-target:
    name: Resolve build target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      commit: ${{ steps.validate.outputs.commit }}
      publish: ${{ steps.validate.outputs.publish }}
    steps:
      - name: Checkout selected release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate ref and select build mode
        id: validate
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ -n "$RELEASE_TAG_INPUT" && "$RELEASE_TAG_INPUT" != "$TAG" ]]; then
              echo "release_tag must match the selected tag ref." >&2
              exit 1
            fi
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag format." >&2
              exit 1
            fi
            COMMIT=$(git rev-parse "$GITHUB_REF^{commit}")
            PUBLISH=true
          elif [[ "$GITHUB_REF" == "refs/heads/dev" && ( "$GITHUB_EVENT_NAME" == "push" || ( "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -z "$RELEASE_TAG_INPUT" ) ) ]]; then
            if [[ -n "$RELEASE_TAG_INPUT" ]]; then
              echo "A release_tag can only be used when dispatching from an existing tag." >&2
              exit 1
            fi
            TAG=""
            COMMIT="$GITHUB_SHA"
            PUBLISH=false
          else
            echo "Builds are allowed from v* tags or the dev branch." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Linux (AppImage & Portable Tarball)
    needs: [resolve-build-target]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-build-target.outputs.commit }}
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libgl1-mesa-dev libglx-dev libegl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libdbus-1-dev libpulse-dev libasound2-dev \
            libx11-xcb-dev libfontconfig1-dev libfreetype6-dev \
            librsvg2-bin protobuf-compiler libprotobuf-dev \
            libfuse2 file xvfb libgl1-mesa-dri mesa-utils \
            libnss3-dev libnspr4-dev libdrm-dev libgbm-dev \
            libxcomposite-dev libxdamage-dev libxrandr-dev \
            libxtst-dev libxcursor-dev libxi-dev \
            libxcb-cursor-dev libxcb-cursor0 libwayland-dev

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools qt5compat qtwebengine qtwebchannel qtpositioning'

      - name: Build Core Daemon
        run: |
          chmod +x scripts/build_core.sh
          ./scripts/build_core.sh

      - name: Package Linux Artifacts
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh

      - name: Test Run AppImage in Headless Environment
        run: |
          chmod +x dist/BeaxtyVPN-Linux-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QT_QPA_PLATFORM=xcb
          export QT_QUICK_BACKEND=software
          export QT_XCB_GL_INTEGRATION=none
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run --auto-servernum -s "-screen 0 1920x1080x24" ./dist/BeaxtyVPN-Linux-x86_64.AppImage --exit-after 2000

      - name: Preserve Linux artifacts for release publication
        uses: actions/upload-artifact@v4
        with:
          name: beaxty-linux
          path: |
            dist/BeaxtyVPN-Linux-x86_64.AppImage
            dist/BeaxtyVPN-Linux-x86_64-Portable.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows Portable (x86_64 ZIP)
    needs: [resolve-build-target]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-build-target.outputs.commit }}
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@v1.1
        with:
          version: '1.11.1'

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qt5compat qtwebengine qtwebchannel qtpositioning'

      - name: Build Core Daemon (Windows)
        shell: bash
        run: |
          cd 3rdparty/throne/core/server
          mkdir -p ../../../../bin
          export GOPROXY="https://proxy.golang.org,direct"
          for i in 1 2 3 4 5; do
            echo "Attempt $i: downloading Go modules..."
            go mod download && break || sleep 5
          done
          VERSION_SINGBOX=$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)
          TAGS="with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls,with_dhcp,with_tailscale"
          CGO_ENABLED=0 go build -v \
            -trimpath \
            -ldflags "-w -s -X 'github.com/sagernet/sing-box/constant.Version=${VERSION_SINGBOX}' -checklinkname=0" \
            -tags "${TAGS}" \
            -o ../../../../bin/beaxty-core.exe .

      - name: Build BeaxtyVPN (Windows)
        shell: bash
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target beaxty-vpn

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $PortableDir = "build\BeaxtyVPN-Windows-x86_64-Portable"
          New-Item -ItemType Directory -Force -Path $PortableDir

          # Copy main executable and core
          if (Test-Path "build\Release\beaxty-vpn.exe") {
            Copy-Item "build\Release\beaxty-vpn.exe" -Destination "$PortableDir\beaxty-vpn.exe"
          } elseif (Test-Path "build\beaxty-vpn.exe") {
            Copy-Item "build\beaxty-vpn.exe" -Destination "$PortableDir\beaxty-vpn.exe"
          } elseif (Test-Path "build\BeaxtyVPN.exe") {
            Copy-Item "build\BeaxtyVPN.exe" -Destination "$PortableDir\beaxty-vpn.exe"
          }
          Copy-Item "bin\beaxty-core.exe" -Destination "$PortableDir\beaxty-core.exe"

          # Download Wintun driver DLL (v0.14.1)
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "build\wintun.zip"
          Expand-Archive -Path "build\wintun.zip" -DestinationPath "build\wintun_extracted" -Force
          Copy-Item "build\wintun_extracted\wintun\bin\amd64\wintun.dll" -Destination "$PortableDir\wintun.dll"

          # Deploy Qt dependencies and QML modules
          $Windeployqt = if (Get-Command windeployqt.exe -ErrorAction SilentlyContinue) { "windeployqt.exe" } else { "$env:QT_ROOT_DIR\bin\windeployqt.exe" }
          & $Windeployqt --release --qmldir src/ui --no-translations --compiler-runtime "$PortableDir\beaxty-vpn.exe"

          # Create ZIP archive
          Compress-Archive -Path "$PortableDir\*" -DestinationPath "dist\BeaxtyVPN-Windows-x86_64-Portable.zip" -Force
          Get-ChildItem -Path dist

      - name: Preserve Windows artifact for release publication
        uses: actions/upload-artifact@v4
        with:
          name: beaxty-windows
          path: dist/BeaxtyVPN-Windows-x86_64-Portable.zip
          if-no-files-found: error

  build-macos:
    name: macOS (DMG)
    needs: [resolve-build-target]
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-build-target.outputs.commit }}
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Setup Ninja
        run: brew install ninja

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtshadertools qt5compat'

      - name: Build Core Daemon (macOS)
        run: |
          cd 3rdparty/throne/core/server
          mkdir -p ../../../../bin
          export GOPROXY="https://proxy.golang.org,direct"
          for i in 1 2 3 4 5; do
            echo "Attempt $i: downloading Go modules..."
            go mod download && break || sleep 5
          done
          VERSION_SINGBOX=$(go list -m -f '{{.Version}}' github.com/sagernet/sing-box)
          TAGS="with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls,with_dhcp,with_tailscale"
          CGO_ENABLED=1 go build -v \
            -trimpath \
            -ldflags "-w -s -X 'github.com/sagernet/sing-box/constant.Version=${VERSION_SINGBOX}' -checklinkname=0" \
            -tags "${TAGS}" \
            -o ../../../../bin/beaxty-core .
          chmod +x ../../../../bin/beaxty-core

      - name: Build BeaxtyVPN (macOS)
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target beaxty-vpn

      - name: Package macOS DMG
        run: |
          mkdir -p dist
          APP_BUNDLE="build/BeaxtyVPN.app"
          if [ ! -d "${APP_BUNDLE}" ]; then
            APP_BUNDLE="build/beaxty-vpn.app"
          fi
          
          # Place core daemon into app bundle Resources
          mkdir -p "${APP_BUNDLE}/Contents/Resources"
          cp bin/beaxty-core "${APP_BUNDLE}/Contents/Resources/beaxty-core"
          chmod +x "${APP_BUNDLE}/Contents/Resources/beaxty-core"

          # Deploy Qt dependencies into the bundle
          MACDEPLOYQT="macdeployqt"
          if [ -n "${QT_ROOT_DIR:-}" ] && [ -x "${QT_ROOT_DIR}/bin/macdeployqt" ]; then
            MACDEPLOYQT="${QT_ROOT_DIR}/bin/macdeployqt"
          fi
          "${MACDEPLOYQT}" "${APP_BUNDLE}" -qmldir=src/ui

          # Ad-hoc code sign bundle
          codesign --force --deep --sign - "${APP_BUNDLE}"

          # Create DMG
          hdiutil create -volname "BeaxtyVPN" -srcfolder "${APP_BUNDLE}" -ov -format UDZO dist/BeaxtyVPN-macOS.dmg
          ls -lh dist

      - name: Preserve macOS artifact for release publication
        uses: actions/upload-artifact@v4
        with:
          name: beaxty-macos
          path: dist/BeaxtyVPN-macOS.dmg
          if-no-files-found: error

  publish-release:
    name: Publish verified release
    if: needs.resolve-build-target.outputs.publish == 'true'
    needs: [resolve-build-target, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-build-target.outputs.commit }}
          fetch-depth: 0

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft, attach artifacts, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-build-target.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve-build-target.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          CURRENT_TAG_COMMIT=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$CURRENT_TAG_COMMIT" != "$RELEASE_COMMIT" ]]; then
            echo "The release tag moved during the build; refusing to publish mismatched artifacts." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Refusing to overwrite an already-published release." >&2
              exit 1
            fi
          else
            EXTRA_FLAGS=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              EXTRA_FLAGS+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Beaxty VPN $RELEASE_TAG" \
              --draft \
              --generate-notes \
              "${EXTRA_FLAGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/*
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
